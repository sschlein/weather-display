; Weather display on an ESP32-3248S035C ("Cheap Yellow Display", 3.5"):
; ST7796 480x320 on HSPI, GT911 capacitive touch on I2C, RGB LED on 4/16/17.

[env:cyd35]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
; Faster corrupts the serial link on this board's CH340.
upload_speed = 460800
board_build.partitions = partitions.csv

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17

build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
